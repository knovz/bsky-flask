[project]
name = "bskyflask"
version = "0.1.0"
description = "Learning python, flask and atproto"
dependencies = [
    "flask",
]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bskyflask"]
